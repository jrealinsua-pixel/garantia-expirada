# Publica el juego (raíz del sitio) y el panel de progreso (/panel/) en GitHub Pages
# cada vez que hay un push a main. Si los tests o el bot fallan, no se publica nada.
name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # El proyecto no tiene dependencias en package.json (las sesiones automáticas no llegan
      # a npm); aquí sí hay red, así que se instalan las herramientas con versión fija.
      - name: Herramientas
        run: npm install -g esbuild@0.28.2 typescript@6.0.3 @types/node@26.6.3

      - name: Comprobar (typecheck, lint, tests y bot)
        run: |
          npm ci
          npm run check
          npm test
          npm run bot -- --partidas 100

      - name: Construir el juego
        run: npm run build

      - name: Añadir el panel y el progreso
        run: |
          mkdir -p dist/panel
          cp -r panel/. dist/panel/
          cp progress.json dist/progress.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
