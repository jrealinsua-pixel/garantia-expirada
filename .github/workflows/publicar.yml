# Publica el juego (raíz del sitio) y el panel de progreso (/panel/) en GitHub Pages
# cada vez que hay un push a main. Antes de que exista package.json, publica solo el panel.
name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Construir el juego
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run build
          else
            mkdir -p dist
            cat > dist/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>Garantía Expirada</title>
          <body style="background:#12141c;color:#e9e6dc;font-family:system-ui;padding:40px">
          <h1>Garantía Expirada</h1><p>El juego todavía se está montando. Mira el <a style="color:#f6c431" href="panel/">panel de progreso</a>.</p>
          HTML
          fi

      - name: Añadir el panel y el progreso
        run: |
          mkdir -p dist/panel
          cp -r panel/. dist/panel/
          cp progress.json dist/progress.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
