# Descarga dependencias de terceros al repositorio (carpeta vendor/).
# Existe porque las sesiones automáticas de Claude se ejecutan sin acceso a registry.npmjs.org:
# GitHub Actions sí lo tiene, descarga la versión fijada y la deja en el repositorio.
name: Vendor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/vendor.yml']

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Descargar Phaser
        run: |
          set -e
          PHASER=3.90.0
          mkdir -p tmp vendor/phaser
          cd tmp && npm pack "phaser@$PHASER" && tar xzf phaser-*.tgz && cd ..
          cp tmp/package/dist/phaser.min.js vendor/phaser/
          cp tmp/package/types/phaser.d.ts vendor/phaser/
          cp tmp/package/types/matter.d.ts vendor/phaser/ 2>/dev/null || true
          cp tmp/package/LICENSE.md vendor/phaser/LICENSE.md
          echo "$PHASER" > vendor/phaser/VERSION
          ls -la vendor/phaser
          rm -rf tmp
      - name: Guardar en main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "vendor: Phaser $(cat vendor/phaser/VERSION) descargado por GitHub Actions"
          for i in 1 2 3; do git pull --rebase origin main && git push origin main && exit 0; sleep 5; done
          exit 1
